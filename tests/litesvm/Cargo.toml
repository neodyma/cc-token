[package]
name = "cc-token-litesvm-tests"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97.1"

[workspace]

[dependencies]
anchor-lang = "=1.2.1"
anchor-spl = "=1.2.1"
cc_token = { path = "../../programs/cc_token", features = ["no-entrypoint"] }
litesvm = "=0.16.0"
litesvm-token = { version = "=0.16.0", features = ["token-2022"] }
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.2.4"
solana-program-runtime = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.5", features = ["verify"] }
wincode = "=0.5.5"
